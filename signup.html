<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Quebrada Cuts</title>

    <link rel="stylesheet" href="./style/signup.css">
</head>
<body>

    <div class="signup-container">
        <h1>💈 Quebrada Cuts</h1>

        <p id="status">Crie sua conta</p>

        <!-- FORMULÁRIO DE CRIAÇÃO DE CONTA -->
        <input type="text" id="nomeCompleto" placeholder="Nome completo">
        <input type="tel" id="telefone" placeholder="Telefone (somente números)">
        <input type="email" id="email" placeholder="Digite seu e-mail">
        <input type="password" id="senha" placeholder="Digite sua senha">
        <input type="password" id="confirmarSenha" placeholder="Confirme sua senha">

        <label for="aceitarTermos" style="display: block; margin: 15px 0; font-size: 0.9em; color: #ccc;">
            <input type="checkbox" id="aceitarTermos" required>
            Aceito os <a href="politica.html" target="_blank" style="color: gold;">Termos de Uso e Política de Privacidade</a>
        </label>

        <button id="criarConta">
            Criar Conta
        </button>

        <p id="user"></p>

        <br>

        <a href="login.html">
            <button class="btn-voltar">← Voltar ao Login</button>
        </a>
    </div>

    <script type="module" src="./js/signup.js"></script>

</body>
</html>
