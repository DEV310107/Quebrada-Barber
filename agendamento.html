<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Quebrada Cuts</title>

    <link rel="stylesheet" href="style/agend.css">
    <link rel="stylesheet" href="style/fundo.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
</head>
<body>
    <main class="agenda-layout">
        <section class="agenda-header">
            <div>
                <h1>Escolha o dia</h1>
                <p class="agenda-subtitle">Seu horário será salvo localmente e você pode confirmar por WhatsApp.</p>
            </div>
        </section>

        <section id="agendaContent">
            <div id="calendario"></div>
            <h2 id="diaSelecionado"></h2>
            <div class="horarios" id="horarios"></div>
            <div id="mensagem" hidden></div>
        </section>

        <a href="index.html" class="voltar">Voltar</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script type="module" src="js/conf.js"></script>
    <script type="module" src="/js/firebase.js"></script>
</body>
</html>
