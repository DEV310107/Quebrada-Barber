<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Quebrada Cuts</title>

    <link rel="stylesheet" href="style/agend.css">
    <link rel="stylesheet" href="style/fundo.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
</head>
<body>
    <main class="agenda-layout">
        <section class="agenda-header">
            <div>
                <h1>Escolha o dia</h1>
                <p class="agenda-subtitle">Seu horario sera salvo no banco de dados da barbearia.</p>
            </div>

            <div class="auth-panel">
                <div id="authStatus" class="auth-status auth-status--off">Verificando login...</div>
                <div id="userInfo" class="user-info" hidden>
                    <img id="userAvatar" class="user-avatar" alt="Foto do usuario">
                    <div>
                        <strong id="userName"></strong>
                        <span id="userEmail"></span>
                    </div>
                </div>
                <div class="auth-buttons">
                    <button id="loginButton" class="btn-destaque" type="button">Entrar com Google</button>
                    <button id="logoutButton" class="btn-secundario" type="button" hidden>Sair</button>
                </div>
            </div>
        </section>

        <section id="loginGate" class="login-gate">
            <h2>Login obrigatorio</h2>
            <p>Entre com sua conta Google para liberar os horarios disponiveis.</p>
        </section>

        <section id="agendaContent" hidden>
            <div id="calendario"></div>
            <h2 id="diaSelecionado"></h2>
            <div class="horarios" id="horarios"></div>
            <div id="mensagem" hidden></div>
        </section>

        <a href="index.html" class="voltar">Voltar</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script type="module" src="js/script.js"></script>
</body>
</html>
