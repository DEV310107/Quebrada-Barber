<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Quebrada Cuts</title>

    <link rel="stylesheet" href="./style/login.css">
    <link rel="stylesheet" href="/style/fundo.css">
</head>
<body>

    <div class="login-container">
        <h1>💈 Quebrada Cuts</h1>

        <p id="status">Entre com sua conta</p>

        <!-- Login com Email e Senha -->
        <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email" required>
        <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>

        <div class="button-row">
            <button id="loginEmail" type="button">
                Entrar
            </button>
            <button id="criarConta" type="button" onclick="window.location.href='signup.html'">
                Criar Conta
            </button>
        </div>

        <!-- Login com Google -->
        <button id="loginGoogle" class="btn-google" type="button">
            <img src="img/g.png" alt="Google" class="google-icon">
            Entrar com Google
        </button>

        <label for="aceitarTermos" class="terms-label">
            <input type="checkbox" id="aceitarTermos" required class="terms-checkbox">
            <span class="terms-text">Aceito os <a href="politica.html" target="_blank">Termos de Uso e Política de Privacidade</a></span>
        </label>

        <p id="user"></p>

        <a href="/index.html" class="btn-back">Voltar</a>
    </div>

    <script type="module" src="./js/login.js"></script>

</body>
</html>
